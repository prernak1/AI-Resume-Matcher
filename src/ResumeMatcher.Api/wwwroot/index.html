<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Resume Matcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f0f2f7;
      min-height: 100vh;
      color: #1a1a2e;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      padding: 2.25rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(79,70,229,.35);
    }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: .4rem; }
    header p  { opacity: .85; font-size: .975rem; }

    /* ── Layout ── */
    .container { max-width: 1140px; margin: 2rem auto; padding: 0 1.5rem; }

    /* ── Upload zone ── */
    .upload-zone {
      background: #fff;
      border: 2.5px dashed #a5b4fc;
      border-radius: 14px;
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 1.5rem;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #4f46e5;
      background: #eef2ff;
    }
    .upload-zone .icon  { font-size: 3.25rem; margin-bottom: .9rem; }
    .upload-zone h2     { font-size: 1.2rem; color: #4f46e5; margin-bottom: .4rem; }
    .upload-zone p      { font-size: .875rem; color: #6b7280; }
    #fileInput          { display: none; }

    /* ── Error ── */
    .error-box {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: .9rem 1.4rem;
      border-radius: 10px;
      font-size: .9rem;
      margin-bottom: 1.25rem;
    }

    /* ── Spinner ── */
    .spinner-wrap {
      display: none;
      background: #fff;
      border-radius: 14px;
      padding: 3rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #e0e7ff;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-wrap p { color: #6b7280; font-size: .9rem; }

    /* ── Results grid ── */
    .results { display: none; gap: 1.5rem; }
    .results.visible { display: grid; grid-template-columns: 340px 1fr; }

    /* ── Analysis panel ── */
    .analysis-panel {
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem;
      height: fit-content;
      position: sticky;
      top: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1e1b4b;
      margin-bottom: 1.1rem;
    }
    .summary-box {
      background: #f5f3ff;
      border-radius: 9px;
      padding: .8rem 1rem;
      font-size: .83rem;
      line-height: 1.65;
      color: #4b5563;
      margin-bottom: 1.15rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .55rem 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: .85rem;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label { color: #9ca3af; }
    .stat-value { font-weight: 600; color: #111827; text-align: right; max-width: 60%; }

    .tags-section { margin-top: 1.15rem; }
    .tags-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #9ca3af;
      margin-bottom: .45rem;
    }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tag {
      display: inline-block;
      padding: .22rem .6rem;
      border-radius: 9999px;
      font-size: .74rem;
      font-weight: 600;
    }
    .tag-skill { background: #e0e7ff; color: #3730a3; }
    .tag-tech  { background: #d1fae5; color: #065f46; }
    .tag-role  { background: #fef3c7; color: #92400e; }

    /* ── Job cards ── */
    .jobs-list { display: flex; flex-direction: column; gap: 1rem; }

    .job-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.4rem 1.5rem;
      border-left: 4px solid #4f46e5;
      box-shadow: 0 1px 8px rgba(0,0,0,.05);
      transition: box-shadow .2s, transform .15s;
    }
    .job-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.1); transform: translateY(-2px); }

    .job-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: .8rem;
    }
    .job-title { font-size: 1.05rem; font-weight: 700; color: #1e1b4b; margin-bottom: .2rem; }
    .job-meta  { font-size: .78rem; color: #9ca3af; }

    .match-badge {
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
      padding: .25rem .8rem;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .match-high { color: #059669; background: #d1fae5; }
    .match-mid  { color: #d97706; background: #fef3c7; }
    .match-low  { color: #dc2626; background: #fee2e2; }

    .bar-wrap { background: #f3f4f6; border-radius: 9999px; height: 6px; margin-bottom: .9rem; overflow: hidden; }
    .bar      { height: 100%; border-radius: 9999px; width: 0; transition: width .7s cubic-bezier(.4,0,.2,1); }
    .bar-high { background: linear-gradient(90deg, #10b981, #34d399); }
    .bar-mid  { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .bar-low  { background: linear-gradient(90deg, #ef4444, #f87171); }

    .reason-text { font-size: .81rem; color: #6b7280; font-style: italic; margin-bottom: .8rem; }

    .skills-row { display: flex; flex-direction: column; gap: .55rem; }
    .skill-group .tags-label-sm {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .3rem;
    }
    .tags-label-sm.green { color: #059669; }
    .tags-label-sm.red   { color: #dc2626; }
    .tag-match { background: #d1fae5; color: #065f46; }
    .tag-miss  { background: #fee2e2; color: #991b1b; }

    .no-results {
      background: #fff;
      border-radius: 14px;
      padding: 2.5rem;
      text-align: center;
      color: #6b7280;
      font-size: .95rem;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ── */
    @media (max-width: 800px) {
      .results.visible { grid-template-columns: 1fr; }
      .analysis-panel  { position: static; }
    }
  </style>
</head>
<body>

<header>
  <h1>🤖 AI Resume Matcher</h1>
  <p>Upload your PDF resume — we'll analyse your skills and surface your best-fit live jobs</p>
</header>

<div class="container">

  <!-- Upload area -->
  <div class="upload-zone" id="uploadZone">
    <div class="icon">📄</div>
    <h2>Drop your resume here</h2>
    <p>Drag &amp; drop a PDF, or <strong>click to browse</strong> &nbsp;·&nbsp; Max 5 MB</p>
    <input type="file" id="fileInput" accept=".pdf" />
  </div>

  <div class="error-box" id="errorBox"></div>

  <!-- Loading -->
  <div class="spinner-wrap" id="spinnerWrap">
    <div class="spinner"></div>
    <p>Extracting skills &amp; matching against live jobs…</p>
  </div>

  <!-- Results -->
  <div class="results" id="results">
    <div class="analysis-panel" id="analysisPanel"></div>
    <div class="jobs-list"     id="jobsList"></div>
  </div>

</div>

<script>
  const uploadZone  = document.getElementById('uploadZone');
  const fileInput   = document.getElementById('fileInput');
  const spinnerWrap = document.getElementById('spinnerWrap');
  const results     = document.getElementById('results');
  const errorBox    = document.getElementById('errorBox');

  /* ── Upload interactions ─────────────────────────────────── */
  uploadZone.addEventListener('click', () => fileInput.click());

  uploadZone.addEventListener('dragover', e => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  ['dragleave', 'dragend'].forEach(ev =>
    uploadZone.addEventListener(ev, () => uploadZone.classList.remove('drag-over'))
  );
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  /* ── Core ───────────────────────────────────────────────── */
  async function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) { showError('Only PDF files are accepted.'); return; }
    if (file.size > 5 * 1024 * 1024)              { showError('File exceeds the 5 MB limit.'); return; }

    hideError();
    hideResults();
    showSpinner();

    const form = new FormData();
    form.append('file', file);

    try {
      const res = await fetch('/api/resume/match?topN=10', { method: 'POST', body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => null);
        throw new Error(err?.title ?? `Server error ${res.status}`);
      }
      renderResults(await res.json());
    } catch (err) {
      showError(err.message || 'Something went wrong. Make sure the API is running.');
    } finally {
      hideSpinner();
    }
  }

  /* ── Render ─────────────────────────────────────────────── */
  function renderResults(data) {
    renderAnalysis(data.analysis, data.fileName);
    renderJobs(data.topMatches);
    results.classList.add('visible');

    // Animate bars after next paint so the transition fires
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('.bar[data-pct]').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    }));
  }

  function renderAnalysis(a, fileName) {
    document.getElementById('analysisPanel').innerHTML = `
      <div class="panel-title">🎯 Resume Analysis</div>
      <div class="summary-box">${esc(a.summary)}</div>

      <div class="stat-row">
        <span class="stat-label">File</span>
        <span class="stat-value">${esc(fileName)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Experience</span>
        <span class="stat-value">${a.yearsOfExperience > 0 ? a.yearsOfExperience + '+ years' : 'Not detected'}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Education</span>
        <span class="stat-value">${esc(a.education)}</span>
      </div>

      ${tagSection('Skills Detected', a.skills,       'tag-skill')}
      ${a.technologies.length ? tagSection('Technologies', a.technologies, 'tag-tech') : ''}
      ${tagSection('Suggested Roles', a.suggestedRoles, 'tag-role')}
    `;
  }

  function renderJobs(jobs) {
    const list = document.getElementById('jobsList');
    if (!jobs.length) {
      list.innerHTML = '<div class="no-results">No matching jobs found. Try a different resume.</div>';
      return;
    }

    list.innerHTML = jobs.map((job, i) => {
      const pct   = job.matchPercentage;
      const grade = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';

      // Parse "(Dept) [Location]" prefix injected by the backend
      const deptM = job.jobDescription.match(/^\(([^)]+)\)/);
      const locM  = job.jobDescription.match(/\[([^\]]+)\]/);
      const dept  = deptM ? deptM[1].replace(/^\d+\s+/, '').trim() : '';
      const loc   = locM  ? locM[1] : '';
      const meta  = [dept, loc].filter(Boolean).join(' &nbsp;·&nbsp; ');

      const matchChips = job.matchingSkills.length
        ? `<div class="skill-group">
             <div class="tags-label-sm green">✅ Matching</div>
             <div class="tags">${job.matchingSkills.map(s => `<span class="tag tag-match">${esc(s)}</span>`).join('')}</div>
           </div>` : '';

      const missChips = job.missingSkills.length
        ? `<div class="skill-group">
             <div class="tags-label-sm red">❌ Missing</div>
             <div class="tags">${job.missingSkills.map(s => `<span class="tag tag-miss">${esc(s)}</span>`).join('')}</div>
           </div>` : '';

      return `
        <div class="job-card" style="animation:fadeUp .35s ease ${i * 0.06}s both">
          <div class="job-card-header">
            <div>
              <div class="job-title">${esc(job.jobTitle)}</div>
              ${meta ? `<div class="job-meta">${meta}</div>` : ''}
            </div>
            <span class="match-badge match-${grade}">${pct}%</span>
          </div>

          <div class="bar-wrap">
            <div class="bar bar-${grade}" data-pct="${pct}"></div>
          </div>

          <div class="reason-text">${esc(job.reason)}</div>

          <div class="skills-row">
            ${matchChips}
            ${missChips}
          </div>
        </div>`;
    }).join('');
  }

  /* ── Helpers ─────────────────────────────────────────────── */
  function tagSection(label, items, cls) {
    if (!items.length) return '';
    return `
      <div class="tags-section">
        <div class="tags-label">${label}</div>
        <div class="tags">${items.map(s => `<span class="tag ${cls}">${esc(s)}</span>`).join('')}</div>
      </div>`;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showSpinner()  { spinnerWrap.style.display = 'block'; }
  function hideSpinner()  { spinnerWrap.style.display = 'none';  }
  function hideResults()  { results.classList.remove('visible'); }
  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
  function hideError()    { errorBox.style.display = 'none'; }
</script>

</body>
</html>
